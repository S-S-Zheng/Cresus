[project]
name = "Cresus"
version = "0.1.0"
description = "Assistant financier"
authors = [
    {name = "S-S-Zheng",email = "zheng.shipo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai>=0.0.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.29",
    "supabase>=2.8",
    "logfire>=0.51",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
]
notebooks = [
    "notebook>=7.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Cresus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E203", # Autorise les les whitespaces avant ":" (style Black)
    "B008", # Autorise les appels de fonctions dans les arguments (FastAPI Depends)
    # "E501", # Optionnel : Ignore les lignes trop longues
]

[tool.ruff.lint.isort]
known-first-party = ["Cresus"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"] # Autorise pytest.raises(Exception) dans les tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["supabase.*", "logfire.*", "streamlit.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests nécessitant des services externes (DB, APIs) -- exclus par défaut",
]
addopts = "-m 'not integration'"
